spring:
  application:
    name: opsmind
  datasource:
    url: jdbc:h2:mem:opsmind;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    generate-unique-name: true
  flyway:
    enabled: true

opsmind:
  document:
    max-size: 20MB
    storage-location: target/test-documents
    max-extracted-characters: 2000000
  chunking:
    parent-max-characters: 1600
    child-max-characters: 500
    child-overlap-characters: 50


spring:
  application:
    name: opsmind
  datasource:
    url: jdbc:h2:mem:opsmind;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    generate-unique-name: true
  flyway:
    enabled: true
    locations: classpath:db/migration

opsmind:
  agent:
    planner:
      provider: local
      model: local-intent-router-v1
      base-url:
      api-key:
      max-output-tokens: 256
  document:
    max-size: 20MB
    storage-location: target/test-documents
    max-extracted-characters: 2000000
  chunking:
    parent-max-characters: 1600
    child-max-characters: 500
    child-overlap-characters: 50
  embedding:
    provider: local
    model: local-feature-hashing-v1
    dimension: 256
    default-top-k: 5
    max-top-k: 50
    base-url:
    api-key:
    batch-size: 20
  search:
    hybrid:
      rrf-k: 60
      candidate-multiplier: 4
      minimum-candidates: 20
  reranking:
    provider: local
    model: local-token-overlap-reranker-v1
    endpoint:
    api-key:
    instruction: Retrieve passages that answer the question.
    candidate-multiplier: 4
    minimum-candidates: 20
  generation:
    provider: local
    model: local-extractive-answer-v1
    base-url:
    api-key:
    evidence-top-k: 5
    minimum-evidence-score: 0.15
    max-context-characters: 12000
    max-output-tokens: 1200
    temperature: 0.1


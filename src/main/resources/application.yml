spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: opsmind
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/opsmind}
    username: ${DB_USERNAME:opsmind}
    password: ${DB_PASSWORD:opsmind}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/postgresql-migration
    validate-on-migrate: true

opsmind:
  document:
    max-size: 20MB
    storage-location: data/documents
    max-extracted-characters: 2000000
  chunking:
    parent-max-characters: 1600
    child-max-characters: 500
    child-overlap-characters: 50
  embedding:
    provider: ${EMBEDDING_PROVIDER:qwen}
    model: ${QWEN_EMBEDDING_MODEL:qwen3.7-text-embedding}
    dimension: ${QWEN_EMBEDDING_DIMENSION:1024}
    default-top-k: 5
    max-top-k: 50
    base-url: ${QWEN_BASE_URL:}
    api-key: ${DASHSCOPE_API_KEY:}
    batch-size: ${QWEN_EMBEDDING_BATCH_SIZE:20}
  search:
    hybrid:
      rrf-k: 60
      candidate-multiplier: 4
      minimum-candidates: 20

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Enterprise RAG Agent Platform

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true


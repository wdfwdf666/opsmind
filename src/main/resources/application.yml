spring:
  config:
    # optional 表示 .env 不存在也允许启动；[.properties] 让 Spring 按 key=value 语法读取它。
    import: optional:file:.env[.properties]
  application:
    # 应用名会出现在 Actuator、日志和监控标签中。
    name: opsmind
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    # ${环境变量:默认值}：优先读环境变量，未设置时使用冒号后的本地默认值。
    url: ${DB_URL:jdbc:postgresql://localhost:5433/opsmind}
    username: ${DB_USERNAME:opsmind}
    password: ${DB_PASSWORD:opsmind}
    hikari:
      # HikariCP 是 Spring Boot 默认连接池，复用数据库连接而不是每次请求重新建立连接。
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    # Flyway 启动时按 V1、V2... 顺序执行数据库迁移，并记录已执行版本。
    enabled: true
    locations: classpath:db/migration,classpath:db/postgresql-migration
    validate-on-migrate: true

opsmind:
  # opsmind.* 是项目自定义配置，会绑定到各个 @ConfigurationProperties record。
  agent:
    planner:
      provider: ${AGENT_PLANNER_PROVIDER:qwen}
      model: ${AGENT_PLANNER_MODEL:${QWEN_PLANNER_MODEL:${QWEN_CHAT_MODEL:qwen3.7-plus}}}
      base-url: ${QWEN_PLANNER_BASE_URL:${QWEN_CHAT_BASE_URL:${QWEN_BASE_URL:}}}
      api-key: ${DASHSCOPE_API_KEY:}
      max-output-tokens: ${QWEN_PLANNER_MAX_OUTPUT_TOKENS:256}
      connect-timeout-ms: ${QWEN_PLANNER_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${QWEN_PLANNER_READ_TIMEOUT_MS:5000}
      max-attempts: ${QWEN_PLANNER_MAX_ATTEMPTS:2}
      # 远程 Planner 短暂失败时使用指数退避；持续失败达到阈值后进入熔断。
      retry-initial-backoff-ms: ${QWEN_PLANNER_RETRY_INITIAL_BACKOFF_MS:200}
      retry-max-backoff-ms: ${QWEN_PLANNER_RETRY_MAX_BACKOFF_MS:1000}
      circuit-failure-threshold: ${QWEN_PLANNER_CIRCUIT_FAILURE_THRESHOLD:5}
      circuit-open-duration-ms: ${QWEN_PLANNER_CIRCUIT_OPEN_DURATION_MS:30000}
      fallback-enabled: ${QWEN_PLANNER_FALLBACK_ENABLED:true}
      fallback-model: ${AGENT_PLANNER_FALLBACK_MODEL:local-intent-router-v2}
  document:
    # 原文件保存到项目 data/documents，数据库保存元数据和 storage key。
    max-size: 20MB
    storage-location: data/documents
    max-extracted-characters: 2000000
  chunking:
    # Parent 提供完整上下文，Child 用于精确召回；Child 间保留 50 字符重叠。
    parent-max-characters: 1600
    child-max-characters: 500
    child-overlap-characters: 50
  embedding:
    # 文档 Child 和用户问题必须使用同一向量模型与维度，才能计算相似度。
    provider: ${EMBEDDING_PROVIDER:qwen}
    model: ${QWEN_EMBEDDING_MODEL:qwen3.7-text-embedding}
    dimension: ${QWEN_EMBEDDING_DIMENSION:1024}
    default-top-k: 5
    max-top-k: 50
    base-url: ${QWEN_BASE_URL:}
    api-key: ${DASHSCOPE_API_KEY:}
    batch-size: ${QWEN_EMBEDDING_BATCH_SIZE:20}
  search:
    hybrid:
      # RRF 只融合名次；候选池通常大于最终 topK，给重排阶段留下空间。
      rrf-k: 60
      candidate-multiplier: 4
      minimum-candidates: 20
  reranking:
    provider: ${RERANKING_PROVIDER:qwen}
    model: ${QWEN_RERANKING_MODEL:qwen3.7-text-rerank}
    endpoint: ${QWEN_RERANK_URL:}
    api-key: ${DASHSCOPE_API_KEY:}
    instruction: Given a user question, retrieve passages that answer the question.
    candidate-multiplier: 4
    minimum-candidates: 20
  generation:
    # 只有检索证据通过最低分门槛后才调用 Chat 模型生成最终答案。
    provider: ${GENERATION_PROVIDER:qwen}
    model: ${QWEN_CHAT_MODEL:qwen3.7-plus}
    base-url: ${QWEN_CHAT_BASE_URL:${QWEN_BASE_URL:}}
    api-key: ${DASHSCOPE_API_KEY:}
    evidence-top-k: 5
    minimum-evidence-score: ${MINIMUM_EVIDENCE_SCORE:0.15}
    max-context-characters: 12000
    max-output-tokens: 1200
    temperature: 0.1

server:
  # 优雅停机：停止接收新请求，并给正在处理的请求一段完成时间。
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  # Actuator 提供健康、指标和 Prometheus 抓取端点；生产环境应通过网络或认证保护。
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true
  metrics:
    distribution:
      # 为 Planner Timer 发布直方图，Prometheus 才能计算跨实例 P95 和 SLO 桶。
      percentiles-histogram:
        opsmind.agent.planner.duration: true
      slo:
        opsmind.agent.planner.duration: 100ms,500ms,1s,2s,5s

info:
  app:
    name: ${spring.application.name}
    description: Enterprise RAG Agent Platform

springdoc:
  # springdoc 根据 Controller 和 OpenAPI 注解自动生成 /swagger-ui.html。
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true


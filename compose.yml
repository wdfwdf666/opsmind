services:
  # PostgreSQL 保存文档、分块、向量、Agent 运行和审批数据；镜像已预装 pgvector 扩展。
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: opsmind
      POSTGRES_USER: opsmind
      POSTGRES_PASSWORD: opsmind
    ports:
      # 宿主机 5433 → 容器 5432，Spring Boot 连接 localhost:5433。
      - "5433:5432"
    volumes:
      # 绑定挂载到项目目录，删除容器后数据仍保留并可直接定位。
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmind -d opsmind"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Alertmanager 接收 Prometheus 触发的告警，负责聚合、静默和状态展示。
  alertmanager:
    image: prom/alertmanager:v0.30.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./data/monitoring/alertmanager:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Prometheus 定时抓取宿主机 Spring Boot 的 /actuator/prometheus，并计算告警规则。
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    extra_hosts:
      # Linux 下把该固定名称映射到宿主机；Docker Desktop 也兼容这个写法。
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./data/monitoring/prometheus:/prometheus
    depends_on:
      # condition 只控制启动顺序，不代表运行期间服务永远可用。
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Grafana 查询 Prometheus 时序数据并展示项目内预置的 OpsMind Dashboard。
  grafana:
    image: grafana/grafana:12.4.12
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      # provisioning 和 dashboard 是版本化配置；data/monitoring/grafana 是运行数据。
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/monitoring/grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
